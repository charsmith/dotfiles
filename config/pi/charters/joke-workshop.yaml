kind: chain
description: Workshop jokes for Netflix data platform all-hands meetings — write → critique → package into a speaker-ready card
persist: true

steps:
  - name: write
    agent: dp-joke-writer
    description: Generate 6–8 setup/punchline jokes from the meeting topic or theme

  - name: critique
    agent: dp-joke-critic
    description: Rate every joke, cut the duds, flag insider-baseball risk, sequence the survivors

  - name: package
    agent: dp-joke-packager
    description: Format the approved jokes into a clean speaker-ready card with delivery tips

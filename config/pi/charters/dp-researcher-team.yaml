kind: team
description: "Data platform research team — coordinator reads KB orientation, checks research-index before every task, decomposes to tool-scoped engineers (parallel dispatch), routes merged findings through platform-architect for cross-tool synthesis, then critic for claim review, and only after an all-clear dispatches to scribe for KB write-back"
topology: hub-spoke
entry_point: dp-research-coordinator
guardrail: auto

# KB: /Users/charsmith/Documents/the_vault/dp-knowledge-base/
# Orientation files every member should know about:
#   tools/_claude/research-index.md    — what's already researched (coordinator checks this first)
#   tools/_claude/cloned-repos.md      — what repos are already cloned locally
#   tools/_claude/research-workflow.md — full research + write-back protocol
#
# Flow:
#   1. coordinator reads KB orientation → checks research-index (stops if Complete)
#   2. coordinator decomposes → routes to engineer-code, engineer-catalog, engineer-docs (parallel)
#      each engineer writes findings to session/findings-{name}.md (code_findings protocol)
#   3. platform-architect reads findings files, writes session/synthesis-architect.md (synthesis protocol)
#   4. critic reads all files, writes session/critic-review.md (synthesis protocol, all_clear gate)
#   5. scribe reads all session files, writes to KB, commits
#   6. coordinator writes output.md reading from session files (never from memory)

protocols:
  - code_findings
  - catalog_findings
  - synthesis

members:
  - agent: dp-research-coordinator
    role: coordinator
    description: "Reads KB orientation, checks research-index (stops if Complete), decomposes question, dispatches engineers in parallel using code_findings/catalog_findings protocols, routes to platform-architect then critic using synthesis protocol, dispatches scribe after all-clear, writes output.md from session files"
    context_dir: /Users/charsmith/Documents/the_vault/dp-knowledge-base/

  - agent: platform-architect
    role: specialist
    context: "Receive findings file paths from coordinator. Read all session/findings-*.md files directly — do not rely on any summary in the coms message. Apply cross-tool synthesis: validate end-to-end story, surface topology fit, flag cross-tool gaps. Write synthesis to session/synthesis-architect.md. Reply using the synthesis protocol."
    context_dir: /Users/charsmith/Documents/the_vault/dp-knowledge-base/
    reports_to: dp-research-coordinator

  - name: engineer-code
    agent: dp-platform-engineer
    role: specialist
    context: "Source code and org focus — og (deep search, API surface, AppConfig/ConfigBin dependencies, proto/REST interface files), ta (repo activity, committer breakdown Jan–Apr), wp (org chain from top committers up to Prashanth Ramdas). Before reading any local source file: run 'git fetch && git pull' and note which branch. Write findings to the file path the coordinator specifies. Every code citation must include absolute file path, line number, AND full github.netflix.net URL with /blob/<branch>/<file>#L<line>. Reply using the code_findings protocol."
    reports_to: dp-research-coordinator

  - name: engineer-catalog
    agent: dp-platform-engineer
    role: specialist
    context: "Data catalog focus — cy (table metadata, schema, owner, lineage, ACL, sample data) and og for schema file references in source repos. Write findings to the file path the coordinator specifies. Cite every cy result with the exact table name, CLI command run, and a representative output excerpt. Reply using the catalog_findings protocol."
    reports_to: dp-research-coordinator

  - name: engineer-docs
    agent: dp-platform-engineer
    role: specialist
    context: "Internal docs and context focus. Step 1 — check if the topic is already summarized in the KB at /Users/charsmith/Documents/the_vault/dp-knowledge-base/ (read existing overview.md/services.md before searching externally). Step 2 — fetch relevant Manuals pages and Google Docs by URL via 'ns fetch'. Step 3 — run 'ns search' for design docs, architecture RFCs, Slack threads, and team pages. Write findings to the file path the coordinator specifies. Cite every claim with the exact ns URL or search result snippet. Reply using the code_findings protocol."
    reports_to: dp-research-coordinator

  - agent: dp-kb-scribe
    role: specialist
    context: "Only act after the coordinator confirms the critic has issued an all-clear. Read all session findings and synthesis files directly — the coordinator will pass you the file paths. Write synthesized findings following research-workflow.md (frontmatter schema, overview.md/services.md/CLAUDE.md/logging.md for single-service; research/<topic>/ for cross-service synthesis). All written docs must link to github.netflix.net URLs. Update research-index.md and cloned-repos.md if needed. Git commit and report the hash."
    reports_to: dp-research-coordinator

  - agent: critic
    role: specialist
    context: "Read all session findings and synthesis files directly — the coordinator will pass you the file paths. Challenge any claim that lacks a specific source (file path + line + URL), is stated with high confidence but cited only as prior knowledge, or is contradicted by other findings. Write review to the file path the coordinator specifies. Reply using the synthesis protocol with all_clear: true only when every claim has a traceable source."
    reports_to: dp-research-coordinator
